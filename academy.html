<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Immortal Snail Chess Academy | Field Guide Edition</title>
<meta name="theme-color" content="#112337">
<style>
*{box-sizing:border-box}:root{color-scheme:dark}body{margin:0;background:#08131f;color:#ebf7f4;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,a{font:inherit}button{border:1px solid #4e6c80;background:#21415a;color:#ecfaf8;padding:8px 14px;border-radius:10px;font-weight:750;cursor:pointer}button:hover{background:#335774}button:focus-visible,a:focus-visible{outline:3px solid #73efda;outline-offset:3px}a{color:#a7e8e2;text-decoration:none}.bar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 19px;border-bottom:1px solid #365069;background:linear-gradient(110deg,#10283a,#173c4b);box-shadow:0 1px 14px #0005}.mark{font-weight:900;display:flex;gap:9px;align-items:center;white-space:nowrap}.mark .chess{font-size:26px}.mark small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#82ddcb;font-weight:800}.mark strong{font-size:16px}.tools{display:flex;align-items:center;gap:8px}.tools label{font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}.tools input{accent-color:#79e0cf}.primary{background:linear-gradient(110deg,#74e0c9,#79bce3);color:#0b2935;border:0}.frame{display:block;width:100%;height:calc(100dvh - 60px);border:none;background:#091522}dialog{padding:0;width:min(1330px,calc(100% - 26px));height:min(95dvh,1020px);border:1px solid #6695a3;border-radius:19px;background:#0b1b2a;box-shadow:0 30px 120px #000a;overflow:hidden}dialog::backdrop{background:#010a15ce;backdrop-filter:blur(4px)}.dialog-bar{height:49px;background:#152d40;border-bottom:1px solid #33596b;padding:7px 15px;display:flex;gap:12px;justify-content:space-between;align-items:center}.dialog-bar strong{font-size:13px}.dialog-bar button{padding:7px 12px}.guide-frame{height:calc(100% - 49px);width:100%;border:none;background:#0b1b2a}.notice{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);border:1px solid #d4b46e;background:#3d3021;color:#ffe6b3;padding:11px 16px;border-radius:13px;max-width:80%;font-size:12px;display:none;z-index:3}@media(max-width:730px){.bar{padding:6px 9px;height:auto;min-height:57px}.mark strong{font-size:13px}.mark small{font-size:8px}.tools{gap:5px}.tools button{padding:7px 9px;font-size:11px}.tools label{display:none}.tools a{display:none}.frame{height:calc(100dvh - 57px)}}
</style>
</head>
<body>
<header class="bar"><div class="mark"><span class="chess" aria-hidden="true">♟</span><div><small>Field Guide Edition</small><strong>Immortal Snail Chess Academy</strong></div></div><div class="tools"><label><input id="namesToggle" type="checkbox" checked> Name the moves</label><button id="guideButton" type="button" class="primary">♜ Special moves & openings</button><a href="./index.html" target="_blank" rel="noopener">Original game</a></div></header>
<iframe id="game" class="frame" src="./index.html" title="Immortal Snail Chess Academy game" allow="autoplay" loading="eager"></iframe>
<dialog id="guideDialog" aria-label="Interactive chess field guide"><div class="dialog-bar"><strong>Chess Field Guide · Rules, tactics & openings</strong><button id="closeGuide" type="button">✕ Close guide</button></div><iframe id="guideFrame" class="guide-frame" title="Interactive chess field guide" src="./chess-guide.html" loading="lazy"></iframe></dialog>
<div class="notice" id="notice" role="status">The original game could not be read in this view. Open academy.html on your GitHub Pages site alongside index.html.</div>
<script>
'use strict';
// A same-origin companion page. It does not overwrite or change the original game's chess engine.
const game=document.getElementById('game');
const dialog=document.getElementById('guideDialog');
const nameToggle=document.getElementById('namesToggle');
const openings=[
 ['e4','King’s Pawn Opening'],['d4','Queen’s Pawn Opening'],['Nf3','Réti Opening'],['c4','English Opening'],
 ['e4 e5','King’s Pawn Game (Open Game)'],['e4 c5','Sicilian Defense'],['e4 e6','French Defense'],['e4 c6','Caro–Kann Defense'],['e4 d5','Scandinavian Defense'],
 ['d4 d5','Queen’s Pawn Game'],['d4 Nf6','Indian Defense'],['e4 e5 f4','King’s Gambit'],['d4 d5 c4','Queen’s Gambit'],
 ['d4 d5 c4 dxc4','Queen’s Gambit Accepted'],['d4 d5 c4 e6','Queen’s Gambit Declined'],
 ['e4 e5 Nf3 Nc6','King’s Knight Opening'],
 ['e4 e5 Nf3 Nc6 Bc4','Italian Game'],['e4 e5 Nf3 Nc6 Bc4 Bc5','Giuoco Piano'],
 ['e4 e5 Nf3 Nc6 Bb5','Ruy Lopez (Spanish Opening)'],['e4 e5 Nf3 Nc6 d4','Scotch Game'],
 ['e4 e5 Nf3 Nc6 Bc4 Bc5 b4','Evans Gambit'],
 ['d4 d5 Bf4','London System setup'],['d4 Nf6 Bf4','London System setup'],
 ['d4 Nf6 c4 g6','King’s Indian setup'],
 ['d4 Nf6 c4 e5','Budapest Gambit'],
 ['e4 e5 Qh5 Nc6 Bc4 Nf6 Qxf7','Scholar’s Mate'],
 ['f3 e5 g4 Qh4','Fool’s Mate']
].map(([seq,name])=>({moves:seq.split(' '),name}));
const clean=s=>s.replace(/×/g,'x').replace(/[+#?!]/g,'').replace(/\s+/g,'').replace(/0-0-0/g,'O-O-O').replace(/0-0/g,'O-O');
const same=(arr,exp)=>exp.every((m,i)=>arr[i]===m);
function openingAt(moves){let found=null;for(const line of openings){if(moves.length>=line.moves.length&&same(moves,line.moves)&&(!found||line.moves.length>found.moves.length))found=line;}return found;}
function showGuide(){if(!dialog.open)dialog.showModal()}
document.getElementById('guideButton').onclick=showGuide;
document.getElementById('closeGuide').onclick=()=>dialog.close();
dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
nameToggle.onchange=()=>{try{localStorage.setItem('snail-chess-move-names',nameToggle.checked?'on':'off')}catch{}renderNotes()};
try{nameToggle.checked=localStorage.getItem('snail-chess-move-names')!=='off'}catch{}
let child=null,observer=null;
function addGuideButtons(doc){
 const top=doc.querySelector('.top-actions');if(top&&!doc.getElementById('specialMovesGuideBtn')){
 const b=doc.createElement('button');b.type='button';b.id='specialMovesGuideBtn';b.textContent='♟ Chess Field Guide';b.title='See special moves, named openings, and tactical examples';b.addEventListener('click',showGuide);
 const target=doc.getElementById('chooseModeBtn');if(target)target.insertAdjacentElement('afterend',b);else top.append(b);
 }
 const tips=doc.getElementById('specialTips');if(tips&&!doc.getElementById('specialMovesExampleBtn')){
 const b=doc.createElement('button');b.type='button';b.id='specialMovesExampleBtn';b.textContent='See illustrated examples →';b.style.cssText='margin-top:10px;width:100%;font-size:12px;padding:9px 10px';b.onclick=showGuide;tips.insertAdjacentElement('afterend',b);
 }
 const log=doc.getElementById('moveLog');if(log&&!doc.getElementById('academyOpeningBanner')){
 const panel=log.closest('.panel');if(panel){const banner=doc.createElement('div');banner.id='academyOpeningBanner';banner.setAttribute('role','status');banner.style.cssText='font-size:11px;color:#a8f6df;line-height:1.5;padding:0 1px 10px;min-height:24px';banner.textContent='Opening names will appear as moves are played.';log.insertAdjacentElement('beforebegin',banner);}
 }
 if(!doc.getElementById('academyNotesStyle')){
 const css=doc.createElement('style');css.id='academyNotesStyle';css.textContent='#moveLog .move-chip{white-space:normal!important;overflow:visible!important;min-width:0;line-height:1.4}#moveLog .academy-move-name{font-size:10px;line-height:1.35;margin-top:5px;padding-top:4px;border-top:1px solid #456677;color:#f9da9c;font-weight:800;overflow-wrap:anywhere}#moveLog{max-height:265px!important}';doc.head.appendChild(css);
 }
}
function renderNotes(){if(!child)return;const log=child.getElementById('moveLog');if(!log)return;const chips=Array.from(log.querySelectorAll(':scope > .move-chip'));
 const sequence=chips.map(c=>{const parts=Array.from(c.childNodes).filter(n=>n.nodeType===3);return clean(parts.map(n=>n.nodeValue).join('').trim())});
 let lastName=null;const found=[];
 for(let i=0;i<sequence.length;i++){const match=openingAt(sequence.slice(0,i+1));let named='';if(match&&match.name!==lastName){named=match.name;lastName=match.name;}else if(match)lastName=match.name;
 const raw=sequence[i]||'';let special='';if(raw==='O-O')special='Kingside castling';else if(raw==='O-O-O')special='Queenside castling';else if(/=([QRBN])/.test(raw)){const p=raw.match(/=([QRBN])/)[1];special=(p==='Q'?'Pawn promotion':'Underpromotion')+' · '+({Q:'Queen',R:'Rook',B:'Bishop',N:'Knight'})[p];}
 found.push([named,special]);}
 const status=(child.getElementById('turnText')?.textContent||'')+' '+(child.getElementById('roundText')?.textContent||'');if(found.length&&/checkmate/i.test(status))found[found.length-1][1]='Checkmate';else if(found.length&&/KING UNDER ATTACK/i.test(status))found[found.length-1][1]='Check';
 const banner=child.getElementById('academyOpeningBanner');if(banner)banner.textContent=!nameToggle.checked?'Move names hidden. Turn on “Name the moves” to see annotations.':lastName?'Recognized opening: '+lastName:'Play a few moves to see any recognized opening names.';
 for(let i=0;i<chips.length;i++){
 const c=chips[i],notes=nameToggle.checked?found[i].filter(Boolean):[];let div=c.querySelector(':scope > .academy-move-name');const value=notes.join(' · ');
 if(value){if(!div){div=child.createElement('div');div.className='academy-move-name';c.appendChild(div)}if(div.textContent!==value)div.textContent=value;}else if(div)div.remove();
 }
}
function connect(){try{
 child=game.contentDocument;if(!child||!child.getElementById('moveLog')){document.getElementById('notice').style.display='block';return;}
 document.getElementById('notice').style.display='none';addGuideButtons(child);renderNotes();
 if(observer)observer.disconnect();observer=new MutationObserver(()=>renderNotes());observer.observe(child.getElementById('moveLog'),{childList:true});
 // Original game redraws history after each move; mutation observer refreshes the labels.
 }catch(err){document.getElementById('notice').style.display='block';console.warn('Academy field guide needs same-origin hosting',err)}
}
game.addEventListener('load',connect);
</script>
</body>
</html>
